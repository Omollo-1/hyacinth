[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hyacinthwatch"
version = "0.1.0"
description = "Water hyacinth detection and monitoring on Lake Victoria from Sentinel-2"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "pyyaml"]

[tool.setuptools.packages.find]
where = ["src"]
